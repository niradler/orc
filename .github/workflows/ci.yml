name: CI

# PR runs disabled (no Actions credit); the same gates run locally via
# .githooks/pre-commit -> scripts/ci-local.ts. Run manually from the Actions tab if needed.
on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bunx biome format ./packages

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run --filter '!@orc/web' test

      - name: Dependency security regressions
        run: bun test scripts/dependency-security.test.ts

      # @orc/web is excluded above because its `test` script drives Playwright,
      # which needs a browser (see e2e.yml). Its browser-free unit tests still
      # belong on every PR.
      - name: Web unit tests
        run: bun run --filter @orc/web test:unit
