name: CI

on:
  # Automatic runner use stays disabled until public-PR isolation is verified.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pull-request:
    if: github.event_name == 'pull_request' && vars.ORC_ISOLATED_PR_RUNNER_READY == 'true'
    runs-on: homelab
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch the base branch
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git fetch origin "$BASE_REF"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright Chromium
        working-directory: packages/web
        run: bunx playwright install chromium

      - name: Changed packages and sanity
        env:
          BASE_REF: ${{ github.base_ref }}
        run: bun scripts/ci-local.ts --changed "origin/$BASE_REF" --sanity

  unit:
    if: github.event_name == 'workflow_dispatch' && github.actor == 'niradler' && github.repository == 'niradler/orc'
    runs-on: homelab
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Unit, type and security gates
        run: bun run ci
