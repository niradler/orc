name: CI

on:
  # Automatic runner use stays disabled until public-PR isolation is verified.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changed:
    if: github.event_name == 'workflow_dispatch' && github.actor == 'niradler' && github.triggering_actor == 'niradler' && github.repository == 'niradler/orc'
    runs-on: homelab
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright Chromium
        working-directory: packages/web
        run: bunx playwright install chromium

      - name: Changed packages, sanity, type and security gates
        run: bun run ci:pr
