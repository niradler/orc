name: CI

on:
  # Same-repository pull requests run here; fork pull requests are skipped
  # because this image is not verified to isolate untrusted code.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.triggering_actor }}
  cancel-in-progress: true

jobs:
  changed:
    if: >
      github.repository == 'niradler/orc' &&
      github.actor == 'niradler' &&
      github.triggering_actor == 'niradler' &&
      (github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: homelab
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The runner image bakes Chromium for the pinned Playwright version into a
      # read-only PLAYWRIGHT_BROWSERS_PATH, so the installer cannot lock that path.
      - name: Verify the baked Playwright browser is usable
        working-directory: packages/web
        run: |
          binary=$(bun -e "process.stdout.write(require('@playwright/test').chromium.executablePath())")
          test -x "$binary" || {
            echo "::error::No Chromium at $binary. Rebuild the runner image for the @playwright/test version in this checkout, then re-dispatch."
            exit 1
          }

      - name: Changed packages, sanity, type and security gates
        run: bun run ci:pr