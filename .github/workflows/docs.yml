name: Docs

# Manual only (limited Actions credit). The normal path is `bun run docs:deploy`,
# which builds locally and publishes to the gh-pages branch.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.triggering_actor }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: read
      pages: read
    if: github.actor == 'niradler' && github.triggering_actor == 'niradler' && github.repository == 'niradler/orc'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile
      - run: bun run docs:build
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: docs/.vitepress/dist

  deploy:
    permissions:
      pages: write
      id-token: write
    if: github.actor == 'niradler' && github.triggering_actor == 'niradler' && github.repository == 'niradler/orc'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
