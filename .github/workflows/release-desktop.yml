name: Release desktop gaps

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - id: matrix
        run: echo "matrix=$(bun scripts/release.ts --ci-matrix)" >> "$GITHUB_OUTPUT"

  desktop:
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - name: Build host binary and desktop bundle
        working-directory: packages/desktop
        run: |
          bun run bin --only host
          bun run bundle
          bun test
          bunx electron-builder --${{ matrix.os }} --${{ matrix.arch }} --publish never
      - name: Verify macOS signature
        if: runner.os == 'macOS'
        run: codesign -v --deep --strict packages/desktop/release/mac-arm64/orc.app
      - name: Smoke test packaged app
        if: runner.os != 'Linux'
        run: bun packages/desktop/scripts/smoke.ts
      - name: Smoke test packaged app on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a bun packages/desktop/scripts/smoke.ts
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.id }}
          path: packages/desktop/release/*.${{ matrix.extension }}
          if-no-files-found: error
          retention-days: 14
