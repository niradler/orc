name: E2E

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    if: github.actor == 'niradler' && github.triggering_actor == 'niradler' && github.repository == 'niradler/orc'
    runs-on: homelab
    timeout-minutes: 60
    env:
      PW_SHARDS: "4"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Same baked-browser contract as CI: the installer cannot write its lock
      # into the read-only PLAYWRIGHT_BROWSERS_PATH.
      - name: Verify the baked Playwright browser is usable
        working-directory: packages/web
        run: |
          binary=$(bun -e "process.stdout.write(require('@playwright/test').chromium.executablePath())")
          test -x "$binary" || {
            echo "::error::No Chromium at $binary. Rebuild the runner image for the @playwright/test version in this checkout, then re-dispatch."
            exit 1
          }

      - name: Browser suite
        run: bun packages/web/scripts/run-e2e.ts
