name: E2E

# PR runs disabled (no Actions credit); the same gates run locally via
# .githooks/pre-commit -> scripts/ci-local.ts. Run manually from the Actions tab if needed.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright Chromium
        working-directory: packages/web
        run: bunx playwright install --with-deps chromium

      - name: E2E tests
        working-directory: packages/web
        run: bun run test
