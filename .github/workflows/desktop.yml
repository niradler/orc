name: Desktop

# PR runs disabled (no Actions credit). Run manually from the Actions tab if needed.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    if: github.actor == 'niradler' && github.triggering_actor == 'niradler' && github.repository == 'niradler/orc'
    name: desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build the orc binary for this OS
        working-directory: packages/desktop
        run: bun run bin --only host

      - name: Bundle the main process
        working-directory: packages/desktop
        run: bun run bundle

      - name: Unit tests
        working-directory: packages/desktop
        run: bun test

      - name: Login-shell PATH tests
        working-directory: packages/cli
        run: bun test src/login-path.test.ts

      - name: Package the installer
        working-directory: packages/desktop
        env:
          CSC_FOR_PULL_REQUEST: "true"
        run: bunx electron-builder

      - name: Verify the macOS code signature
        if: runner.os == 'macOS'
        working-directory: packages/desktop
        run: codesign -v --deep --strict release/mac-arm64/orc.app

      - name: Smoke test the packaged app
        if: runner.os != 'Linux'
        working-directory: packages/desktop
        run: bun scripts/smoke.ts

      - name: Smoke test the packaged app (xvfb)
        if: runner.os == 'Linux'
        working-directory: packages/desktop
        run: xvfb-run -a bun scripts/smoke.ts

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: orc-desktop-${{ matrix.os }}
          path: |
            packages/desktop/release/*.dmg
            packages/desktop/release/*.AppImage
            packages/desktop/release/*.exe
          if-no-files-found: error
          retention-days: 7
