<!doctype html>
<html class="dark" lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (() => {
        let theme = "dark";
        let fontSize = "default";
        try {
          if (localStorage.getItem("orc_theme") === "light") theme = "light";
          const size = localStorage.getItem("orc_font_size");
          if (size === "large" || size === "x-large") fontSize = size;
        } catch {}
        document.documentElement.classList.toggle("dark", theme === "dark");
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        if (fontSize !== "default") document.documentElement.dataset.fontSize = fontSize;
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>ORC - Agent Orchestration</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="ORC" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  </head>
  <body class="bg-background text-on-surface font-body">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
