appId: dev.orc.desktop
productName: orc
artifactName: orc-${version}-${os}-${arch}.${ext}
nsis:
  runAfterFinish: false
directories:
  output: release
files:
  - dist/**
  - build/icon.png
  - package.json
mac:
  category: public.app-category.developer-tools
  identity: "-"
  target: dmg
  extraResources:
    - from: ../cli/dist/orc-mac-${arch}
      to: orc
win:
  target: nsis
  extraResources:
    - from: ../cli/dist/orc-windows-x64.exe
      to: orc.exe
linux:
  executableName: orc
  category: Development
  target: AppImage
  extraResources:
    - from: ../cli/dist/orc-linux-${arch}
      to: orc
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  onlyLoadAppFromAsar: true
  grantFileProtocolExtraPrivileges: false
