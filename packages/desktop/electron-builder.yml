appId: dev.orc.desktop
productName: orc
artifactName: orc-${version}-${os}-${arch}.${ext}
nsis:
  runAfterFinish: false
directories:
  output: release
files:
  - dist/main.js
  - dist/preload.cjs
  - build/icon.png
  - package.json
publish:
  provider: github
  owner: niradler
  repo: orc
mac:
  category: public.app-category.developer-tools
  identity: "-"
  target:
    - dmg
    - zip
  extraResources:
    - from: ../cli/dist/orc-mac-${arch}
      to: orc
win:
  target: nsis
  extraResources:
    - from: ../cli/dist/orc-windows-x64.exe
      to: orc.exe
linux:
  executableName: orc
  category: Development
  target: AppImage
  extraResources:
    - from: ../cli/dist/orc-linux-${arch}
      to: orc
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  onlyLoadAppFromAsar: true
  grantFileProtocolExtraPrivileges: false
