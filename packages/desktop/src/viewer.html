<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'none'; img-src data:; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ORC · Browser and files</title>
  <link rel="stylesheet" href="viewer.css">
</head>
<body>
  <header>
    <nav aria-label="Viewer">
      <button id="browser" type="button" aria-pressed="true">Browser</button>
      <button id="file" type="button">Open file…</button>
      <span id="filename"></span>
      <span class="hint">Read-only · local files</span>
    </nav>
    <form id="navigation">
      <button type="button" id="back" aria-label="Back" disabled>←</button>
      <button type="button" id="forward" aria-label="Forward" disabled>→</button>
      <button type="button" id="reload" aria-label="Reload">↻</button>
      <input id="address" type="url" aria-label="Address" placeholder="https://example.com" autocomplete="off" spellcheck="false">
      <button type="submit">Go</button>
      <button type="button" id="external">System browser ↗</button>
    </form>
    <p id="status" role="status" aria-live="polite"></p>
  </header>
  <main>
    <p id="empty">Enter a web address, or open an image, Markdown, code or text file.</p>
    <img id="image" alt="" hidden>
    <textarea id="content" aria-label="Read-only file content" readonly wrap="off" spellcheck="false" hidden></textarea>
  </main>
  <script src="viewer-renderer.js"></script>
</body>
</html>
